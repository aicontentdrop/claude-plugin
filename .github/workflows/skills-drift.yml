name: Skills match the published source

# The skills in this plugin are copies of skills published in
# aicontentdrop/aicontentdrop (the npm package's repository). This check fails
# when a copy here stops being byte-identical to its source, so the two public
# versions of a skill can never tell different stories.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: aicontentdrop/aicontentdrop
          path: .source

      - name: Every bundled skill is byte-identical to its source
        run: |
          set -eu
          status=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            if [ ! -d ".source/skills/$name" ]; then
              echo "::error::skills/$name has no source in aicontentdrop/aicontentdrop/skills"
              status=1
            elif ! diff -r "skills/$name" ".source/skills/$name"; then
              echo "::error::skills/$name differs from aicontentdrop/aicontentdrop/skills/$name"
              status=1
            fi
          done
          exit "$status"

      - name: The manifest parses and names the plugin
        run: |
          node -e '
            const m = require("./.claude-plugin/plugin.json");
            if (m.name !== "aicontentdrop" || !/^\d+\.\d+\.\d+$/.test(m.version)) {
              console.error("unexpected manifest", m.name, m.version);
              process.exit(1);
            }
            console.log(m.name, m.version);
          '

      - name: The plugin ships no MCP server, hooks or agents
        run: |
          set -eu
          for forbidden in .mcp.json hooks agents; do
            if [ -e "$forbidden" ]; then
              echo "::error::$forbidden is not allowed in this advisory plugin"
              exit 1
            fi
          done
